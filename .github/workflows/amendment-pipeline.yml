name: Amendment Pipeline

on:
  schedule:
    # 매일 18:00 UTC = 03:00 KST(다음날). 주기를 바꾸려면 이 cron만 수정하면 된다.
    # 예) 6시간마다: '0 0,6,12,18 * * *'  /  매주 월요일: '0 18 * * 0'(월요일 03:00 KST)
    - cron: '0 18 * * *'
  workflow_dispatch: {} # "새로고침" 역할 — Actions 탭에서 언제든 수동 실행 가능

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - run: npm ci

      - name: Run pipeline (detect -> save -> extract -> diff -> summarize)
        run: node scripts/runPipelineOnce.js
        env:
          LAW_OC: ${{ secrets.LAW_OC }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
